<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="https://www.mediadekho.com/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media Dekho | India's #1 Media Buying Agency & Ad Aggregator</title>

    <!-- Fallback meta tags for the moment before a page's own
         useDocumentMeta() call runs (and for anything that reads them
         without executing JS, e.g. a share-preview bot). Every route
         overrides these with its own values on mount. -->
    <meta name="description" content="Plan, compare, and book advertising spots instantly across Print Online, Digital, Entertainment & Sports." />
    <meta property="og:site_name" content="Media Dekho" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Media Dekho | India's #1 Media Buying Agency & Ad Aggregator" />
    <meta property="og:description" content="Plan, compare, and book advertising spots instantly across Print Online, Digital, Entertainment & Sports." />
    <meta name="twitter:card" content="summary" />

    <!-- Google Fonts & FontAwesome CDN -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Bootstrap Icons: matches the admin panel's category icon field (e.g. "bi-book"), so an admin-picked icon renders correctly here too. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Razorpay Checkout widget — window.Razorpay used by CartPage's checkout flow. -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  </head>
  <body class="bg-slate-50 text-slate-800 font-inter antialiased min-h-screen selection:bg-[#e62e3d] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

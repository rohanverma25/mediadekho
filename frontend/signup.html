<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Media Dekho - Media Buying Aggregator</title>
  <meta name="description" content="Create your free Media Dekho account to get direct media owner rates, instant campaign proposals, and real-time ad tracking.">

  <!-- Favicon -->
  <link rel="icon" href="https://www.mediadekho.com/favicon.ico">

  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              red: '#c01625',
              'red-dark': '#a0101c',
              dark: '#0f172a',
              surface: '#ffffff',
              subtle: '#f8fafc',
              accent: '#c01625'
            }
          },
          fontFamily: {
            outfit: ['Outfit', 'sans-serif'],
            inter: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 text-slate-800 font-inter antialiased min-h-screen flex flex-col justify-between selection:bg-brand-red selection:text-white">

  <!-- Header Bar -->
  <header class="bg-white border-b border-slate-200 py-4 px-6">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <a href="index.html" class="flex items-center gap-3 group">
        <div class="w-10 h-10 rounded-xl bg-brand-red flex items-center justify-center text-white font-outfit font-black text-xl shadow-lg shadow-brand-red/30 group-hover:scale-105 transition-transform">
          MD
        </div>
        <div>
          <span class="font-outfit font-black text-xl tracking-tight text-slate-900 block leading-none">MEDIA</span>
          <span class="font-outfit font-bold text-xs tracking-widest text-brand-red uppercase block">DEKHO</span>
        </div>
      </a>

      <div class="text-xs text-slate-500">
        Already have an account? 
        <a href="login.html" class="text-brand-red font-bold hover:underline ml-1">Log In</a>
      </div>
    </div>
  </header>

  <!-- Main Signup Card Container -->
  <main class="flex-1 flex items-center justify-center p-4 sm:p-6 py-12">
    <div class="w-full max-w-lg bg-white rounded-3xl border border-slate-200 shadow-2xl p-8 space-y-6">
      
      <div class="text-center space-y-2">
        <div class="w-12 h-12 rounded-2xl bg-red-50 text-brand-red flex items-center justify-center text-xl font-bold mx-auto border border-red-100">
          <i class="fa-solid fa-user-plus"></i>
        </div>
        <h1 class="font-outfit font-extrabold text-2xl sm:text-3xl text-slate-900">Create Free Account</h1>
        <p class="text-xs text-slate-500 font-medium">Join 5,000+ brands & agencies planning media campaigns with direct owner rates.</p>
      </div>



      <!-- Form -->
      <form id="signup-form" class="space-y-4" onsubmit="handleSignupSubmit(event)">
        
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Full Name *</label>
          <div class="relative">
            <input type="text" required placeholder="e.g. Rajesh Kumar" class="glass-input w-full rounded-xl px-3.5 py-2.5 text-xs pl-9">
            <i class="fa-solid fa-user absolute left-3 top-3 text-slate-400 text-xs"></i>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Work Email *</label>
            <div class="relative">
              <input type="email" required placeholder="name@company.com" class="glass-input w-full rounded-xl px-3.5 py-2.5 text-xs pl-9">
              <i class="fa-solid fa-envelope absolute left-3 top-3 text-slate-400 text-xs"></i>
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Phone Number *</label>
            <div class="relative">
              <input type="tel" required placeholder="+91 98765 43210" class="glass-input w-full rounded-xl px-3.5 py-2.5 text-xs pl-9">
              <i class="fa-solid fa-phone absolute left-3 top-3 text-slate-400 text-xs"></i>
            </div>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Company / Brand Name</label>
          <div class="relative">
            <input type="text" placeholder="e.g. TechCorp Solutions" class="glass-input w-full rounded-xl px-3.5 py-2.5 text-xs pl-9">
            <i class="fa-solid fa-building absolute left-3 top-3 text-slate-400 text-xs"></i>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Create Password *</label>
          <div class="relative">
            <input type="password" required placeholder="At least 8 characters" class="glass-input w-full rounded-xl px-3.5 py-2.5 text-xs pl-9">
            <i class="fa-solid fa-lock absolute left-3 top-3 text-slate-400 text-xs"></i>
          </div>
        </div>

        <div class="flex items-start gap-2 text-xs">
          <input type="checkbox" required class="custom-checkbox rounded mt-0.5">
          <span class="text-slate-600">I agree to the <a href="#" class="text-brand-red font-semibold hover:underline">Terms of Service</a> and <a href="#" class="text-brand-red font-semibold hover:underline">Privacy Policy</a>.</span>
        </div>

        <button type="submit" class="w-full bg-brand-red hover:bg-brand-red-dark text-white font-outfit font-bold text-sm py-3 rounded-xl shadow-lg shadow-brand-red/25 transition flex items-center justify-center gap-2">
          <span>Create Account</span>
          <i class="fa-solid fa-check text-xs"></i>
        </button>
      </form>

      <div class="pt-4 border-t border-slate-100 text-center text-xs text-slate-500">
        Already have an account? 
        <a href="login.html" class="text-brand-red font-bold hover:underline">Log In here</a>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500">
    © 2026 Media Dekho Pvt Ltd. All Rights Reserved.
  </footer>

  <!-- Toast Container -->
  <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <script src="js/app.js"></script>
  <script>
    function handleSignupSubmit(e) {
      e.preventDefault();
      showToast('Account created successfully! Welcome to Media Dekho.', 'success');
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 1500);
    }
  </script>
</body>
</html>
